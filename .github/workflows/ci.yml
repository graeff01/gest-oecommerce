name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-auth-secret-change-only-for-build-1234567890
      ADMIN_DATA_KEY: ci-admin-data-key-change-only-for-build-1234567890
      ADMIN_MASTER_ONLY: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
